name = "sveltia-cms-auth"
main = "src/index.js"
compatibility_date = "2023-03-24"

# Kept here so a redeploy doesn't drop them. GITHUB_CLIENT_SECRET stays a Secret in the
# Cloudflare dashboard (Settings → Variables and Secrets) and is never committed.
[vars]
ALLOWED_DOMAINS = "connorscurriculum.com, serrialerror.github.io, localhost"
GITHUB_CLIENT_ID = "Ov23linSJ7FHhlplIGJ9"
# Question feedback (src/feedback.js) files issues here. The fine-grained token with "Issues: Read
# and write" on this repository is the GITHUB_FEEDBACK_TOKEN Secret in the Cloudflare dashboard.
FEEDBACK_REPO = "SerrialError/connorscurriculum"

# At most 5 feedback posts per minute from one IP address.
[[ratelimits]]
name = "FEEDBACK_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }
